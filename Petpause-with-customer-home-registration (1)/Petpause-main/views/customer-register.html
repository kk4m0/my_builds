<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer registration | PetPause</title><link rel="stylesheet" href="/static/style.css"></head>
<body class="bare"><div class="login" style="max-width:560px"><a class="brand" href="/">🐾 <span>PetPause<small>Customer account</small></span></a><div class="card" style="margin-top:20px"><h1>Create your account</h1><p class="muted">Register to send a booking request for your pet.</p><div id="message"></div>
<form id="registerForm"><div class="field"><label for="fullName">Full name *</label><input id="fullName" name="fullName" type="text" required autocomplete="name"></div>
<div class="field"><label for="email">Email address *</label><input id="email" name="email" type="email" required autocomplete="email"></div>
<div class="field"><label for="phone">Phone number *</label><input id="phone" name="phone" type="tel" required placeholder="082 555 0000" pattern="[0-9 +()-]{10,20}"></div>
<div class="field"><label for="password">Password *</label><input id="password" name="password" type="password" required minlength="10" autocomplete="new-password"><div class="help">At least 10 characters, with uppercase, lowercase, number and symbol.</div></div>
<div class="field"><label for="password2">Confirm password *</label><input id="password2" name="password2" type="password" required minlength="10" autocomplete="new-password"></div>
<button class="btn pri" type="submit">Create account</button></form><p class="help" style="margin-top:16px"><a href="/">Back to home</a> · Already registered? <a href="/book-for-pet">Request a booking</a></p></div></div>
<script src="/static/js/customer-register.js"></script></body></html>
